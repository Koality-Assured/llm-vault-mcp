<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="100%" height="100%">
  <defs>
    <linearGradient id="bg-grad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#080C14" />
      <stop offset="50%" stop-color="#0F172A" />
      <stop offset="100%" stop-color="#080C14" />
    </linearGradient>
    <linearGradient id="primary-grad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#14B8A6" />
      <stop offset="50%" stop-color="#6366F1" />
      <stop offset="100%" stop-color="#F59E0B" />
    </linearGradient>
    <linearGradient id="accent-cyan" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#14B8A6" />
      <stop offset="100%" stop-color="#6366F1" />
    </linearGradient>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="8" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>

  <!-- Background Shield Canvas -->
  <rect width="512" height="512" rx="112" fill="url(#bg-grad)" stroke="#1E293B" stroke-width="4" />

  <!-- Background Geometric Orbit Tracks -->
  <g opacity="0.2" stroke="#475569" stroke-width="1.5">
    <circle cx="256" cy="256" r="210" fill="none" stroke-dasharray="6 8" />
    <circle cx="256" cy="256" r="160" fill="none" />
    <circle cx="256" cy="256" r="110" fill="none" stroke-dasharray="4 6" />
    <line x1="256" y1="46" x2="256" y2="466" />
    <line x1="46" y1="256" x2="466" y2="256" />
  </g>

  <!-- Outer Orbit Nodes -->
  <circle cx="256" cy="256" r="185" fill="none" stroke="url(#accent-cyan)" stroke-width="3" opacity="0.5" stroke-dasharray="40 20 80 20" />
  <g fill="#0B0F19" stroke-width="3">
    <circle cx="256" cy="71" r="14" stroke="#14B8A6" />
    <circle cx="256" cy="71" r="5" fill="#14B8A6" />
    <circle cx="441" cy="256" r="14" stroke="#6366F1" />
    <circle cx="441" cy="256" r="5" fill="#6366F1" />
    <circle cx="256" cy="441" r="14" stroke="#F59E0B" />
    <circle cx="256" cy="441" r="5" fill="#F59E0B" />
    <circle cx="71" cy="256" r="14" stroke="#14B8A6" />
    <circle cx="71" cy="256" r="5" fill="#14B8A6" />
  </g>

  <!-- Central Emblem Geometry -->
  <g filter="url(#glow)">

    <!-- Model Context Protocol Socket Motif -->
    <circle cx="256" cy="256" r="90" fill="none" stroke="#14B8A6" stroke-width="5" stroke-dasharray="16 8" />
    <circle cx="256" cy="256" r="60" fill="#0B0F19" stroke="#6366F1" stroke-width="4" />
    <!-- Socket Pins -->
    <circle cx="226" cy="236" r="10" fill="#14B8A6" />
    <circle cx="286" cy="236" r="10" fill="#14B8A6" />
    <circle cx="226" cy="276" r="10" fill="#F59E0B" />
    <circle cx="286" cy="276" r="10" fill="#F59E0B" />
    <circle cx="256" cy="256" r="6" fill="#FFFFFF" />
    <!-- Neural Bus Rays -->
    <line x1="166" y1="256" x2="130" y2="256" stroke="#6366F1" stroke-width="4" stroke-linecap="round" />
    <line x1="346" y1="256" x2="382" y2="256" stroke="#6366F1" stroke-width="4" stroke-linecap="round" />
        
  </g>

  <!-- Bus Trajectory Pulses -->
  <circle cx="176" cy="134" r="4" fill="#14B8A6" filter="url(#glow)" />
  <circle cx="336" cy="134" r="4" fill="#6366F1" filter="url(#glow)" />
  <circle cx="336" cy="378" r="4" fill="#F59E0B" filter="url(#glow)" />
  <circle cx="176" cy="378" r="4" fill="#14B8A6" filter="url(#glow)" />
</svg>
