<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 400" width="100%" height="100%">
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#080C14" />
      <stop offset="40%" stop-color="#0F172A" />
      <stop offset="100%" stop-color="#080C14" />
    </linearGradient>
    <linearGradient id="accent-cyan" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#14B8A6" />
      <stop offset="100%" stop-color="#6366F1" />
    </linearGradient>
    <linearGradient id="core-glow" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#14B8A6" />
      <stop offset="50%" stop-color="#6366F1" />
      <stop offset="100%" stop-color="#F59E0B" />
    </linearGradient>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="6" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>

  <!-- Background Backdrop -->
  <rect width="1280" height="400" fill="url(#bg)" />

  <!-- Tech Matrix Blueprint Grid -->
  <g opacity="0.12" stroke="#14B8A6" stroke-width="1">
    <pattern id="grid" width="40" height="40" patternUnits="userSpaceOnUse">
      <path d="M 40 0 L 0 0 0 40" fill="none" />
    </pattern>
    <rect width="1280" height="400" fill="url(#grid)" />
  </g>

  <!-- High-Tech Data Stream Vectors -->
  <g opacity="0.25">
    <path d="M -50 100 Q 300 60 640 180 T 1330 220" fill="none" stroke="#14B8A6" stroke-width="2" />
    <path d="M -50 280 Q 400 340 780 240 T 1330 140" fill="none" stroke="#6366F1" stroke-width="2" />
  </g>

  <!-- Left: Hero Graphic Emblematics -->
  <g transform="translate(180, 200)">
    <!-- Concentric Orbit Rings -->
    <circle cx="0" cy="0" r="140" fill="none" stroke="#334155" stroke-width="1.5" stroke-dasharray="6 8" opacity="0.4" />
    <circle cx="0" cy="0" r="110" fill="none" stroke="#14B8A6" stroke-width="2" stroke-dasharray="30 15 60 15" opacity="0.7" />
    <circle cx="0" cy="0" r="80" fill="none" stroke="#6366F1" stroke-width="2" opacity="0.6" />
    
    <!-- Outer Spoke Nodes -->
    <circle cx="0" cy="-140" r="10" fill="#0B0F19" stroke="#14B8A6" stroke-width="3" />
    <circle cx="140" cy="0" r="10" fill="#0B0F19" stroke="#6366F1" stroke-width="3" />
    <circle cx="0" cy="140" r="10" fill="#0B0F19" stroke="#F59E0B" stroke-width="3" />
    <circle cx="-140" cy="0" r="10" fill="#0B0F19" stroke="#14B8A6" stroke-width="3" />

    <!-- Central Iconography Transformed -->
    <g transform="translate(-256, -256)">

    <!-- Model Context Protocol Socket Motif -->
    <circle cx="256" cy="256" r="90" fill="none" stroke="#14B8A6" stroke-width="5" stroke-dasharray="16 8" />
    <circle cx="256" cy="256" r="60" fill="#0B0F19" stroke="#6366F1" stroke-width="4" />
    <!-- Socket Pins -->
    <circle cx="226" cy="236" r="10" fill="#14B8A6" />
    <circle cx="286" cy="236" r="10" fill="#14B8A6" />
    <circle cx="226" cy="276" r="10" fill="#F59E0B" />
    <circle cx="286" cy="276" r="10" fill="#F59E0B" />
    <circle cx="256" cy="256" r="6" fill="#FFFFFF" />
    <!-- Neural Bus Rays -->
    <line x1="166" y1="256" x2="130" y2="256" stroke="#6366F1" stroke-width="4" stroke-linecap="round" />
    <line x1="346" y1="256" x2="382" y2="256" stroke="#6366F1" stroke-width="4" stroke-linecap="round" />
        
    </g>
  </g>

  <!-- Right: Typography & Capability Badges -->
  <g transform="translate(420, 100)">
    <!-- Overline Category Capsule -->
    <rect x="0" y="0" width="310" height="26" rx="13" fill="#1E293B" stroke="#334155" stroke-width="1" />
    <circle cx="14" cy="13" r="5" fill="#14B8A6" filter="url(#glow)" />
    <text x="28" y="17" fill="#94A3B8" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="11" font-weight="700" letter-spacing="1.5">KOALITY-ASSURED • PROTOCOL SERVER</text>

    <!-- Project Title -->
    <text x="0" y="72" fill="#FFFFFF" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="48" font-weight="900" letter-spacing="1">LLM VAULT MCP</text>

    <!-- Subtitle -->
    <text x="0" y="110" fill="#94A3B8" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="17" font-weight="400">Model Context Protocol Server for Zero-Context Secret Injection &amp; Local Envelope Decryption</text>

    <!-- Capability Chips -->
    <g transform="translate(0, 150)">
      <!-- Chip 1: Model Context Protocol -->
      <g transform="translate(0, 0)">
        <rect x="0" y="0" width="246" height="38" rx="8" fill="#111827" stroke="#14B8A6" stroke-width="1.5" />
        <circle cx="18" cy="19" r="4" fill="#14B8A6" />
        <text x="32" y="24" fill="#E2E8F0" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="13" font-weight="600">Model Context Protocol</text>
      </g>
      <!-- Chip 2: Zero-Context Injection -->
      <g transform="translate(260, 0)">
        <rect x="0" y="0" width="246" height="38" rx="8" fill="#111827" stroke="#6366F1" stroke-width="1.5" />
        <circle cx="18" cy="19" r="4" fill="#6366F1" />
        <text x="32" y="24" fill="#E2E8F0" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="13" font-weight="600">Zero-Context Injection</text>
      </g>
      <!-- Chip 3: Stream Scrubber -->
      <g transform="translate(520, 0)">
        <rect x="0" y="0" width="183" height="38" rx="8" fill="#111827" stroke="#F59E0B" stroke-width="1.5" />
        <circle cx="18" cy="19" r="4" fill="#F59E0B" />
        <text x="32" y="24" fill="#E2E8F0" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="13" font-weight="600">Stream Scrubber</text>
      </g>
      <!-- Chip 4: Ephemeral Leasing -->
      <g transform="translate(717, 0)">
        <rect x="0" y="0" width="201" height="38" rx="8" fill="#111827" stroke="#38BDF8" stroke-width="1.5" />
        <circle cx="18" cy="19" r="4" fill="#38BDF8" />
        <text x="32" y="24" fill="#E2E8F0" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="13" font-weight="600">Ephemeral Leasing</text>
      </g>
    </g>
  </g>
</svg>
